<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none">
  <title>Signa achievement coin — COURSE_MASTER (silver)</title>
  <defs>
    <!-- Exact silhouette of the coin: reuse it to clip anything that must stay inside the coin -->
    <clipPath id="coin-clip"><circle cx="150" cy="150" r="134.82"/></clipPath>
    <linearGradient id="shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- COIN: outer rim + face. Recolour per tier here. -->
  <g id="coin">
    <circle cx="150" cy="150" r="134.82" fill="#e1e7ee"/>
    <circle cx="150" cy="150" r="126" fill="#c5ced8"/>
  </g>

  <!-- EMBLEM: the carved icon. REPLACE the contents of this group for each achievement.
       Keep it centred on (150,150) and ~55% of the face diameter (about 140 units wide). -->
  <g id="emblem">
    <path transform="translate(77.5 78) scale(0.578125)" d="M176,207.24a119,119,0,0,0,16-7.73V240a8,8,0,0,1-16,0Zm11.76-88.43-56-29.87a8,8,0,0,0-7.52,14.12L171,128l17-9.06Zm64-29.87-120-64a8,8,0,0,0-7.52,0l-120,64a8,8,0,0,0,0,14.12L32,117.87v48.42a15.91,15.91,0,0,0,4.06,10.65C49.16,191.53,78.51,216,128,216a130,130,0,0,0,48-8.76V130.67L171,128l-43,22.93L43.83,106l0,0L25,96,128,41.07,231,96l-18.78,10-.06,0L188,118.94a8,8,0,0,1,4,6.93v73.64a115.63,115.63,0,0,0,27.94-22.57A15.91,15.91,0,0,0,224,166.29V117.87l27.76-14.81a8,8,0,0,0,0-14.12Z" fill="#7d8794"/>
    <path transform="translate(79.5 80.5) scale(0.578125)" d="M176,207.24a119,119,0,0,0,16-7.73V240a8,8,0,0,1-16,0Zm11.76-88.43-56-29.87a8,8,0,0,0-7.52,14.12L171,128l17-9.06Zm64-29.87-120-64a8,8,0,0,0-7.52,0l-120,64a8,8,0,0,0,0,14.12L32,117.87v48.42a15.91,15.91,0,0,0,4.06,10.65C49.16,191.53,78.51,216,128,216a130,130,0,0,0,48-8.76V130.67L171,128l-43,22.93L43.83,106l0,0L25,96,128,41.07,231,96l-18.78,10-.06,0L188,118.94a8,8,0,0,1,4,6.93v73.64a115.63,115.63,0,0,0,27.94-22.57A15.91,15.91,0,0,0,224,166.29V117.87l27.76-14.81a8,8,0,0,0,0-14.12Z" fill="#7d8794"/>
    <path transform="translate(76 76) scale(0.578125)" d="M176,207.24a119,119,0,0,0,16-7.73V240a8,8,0,0,1-16,0Zm11.76-88.43-56-29.87a8,8,0,0,0-7.52,14.12L171,128l17-9.06Zm64-29.87-120-64a8,8,0,0,0-7.52,0l-120,64a8,8,0,0,0,0,14.12L32,117.87v48.42a15.91,15.91,0,0,0,4.06,10.65C49.16,191.53,78.51,216,128,216a130,130,0,0,0,48-8.76V130.67L171,128l-43,22.93L43.83,106l0,0L25,96,128,41.07,231,96l-18.78,10-.06,0L188,118.94a8,8,0,0,1,4,6.93v73.64a115.63,115.63,0,0,0,27.94-22.57A15.91,15.91,0,0,0,224,166.29V117.87l27.76-14.81a8,8,0,0,0,0-14.12Z" fill="#e1e7ee"/>
  </g>

  <!-- GLOSS: static 20% white veil over the whole coin (as in the current medal). -->
  <g id="gloss">
    <circle cx="150" cy="150" r="134.82" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>

  <!-- SHINE: diagonal light band, clipped to the coin. The app animates ONLY this group,
       sliding it with translateX from -260 (off the left edge) to +260 (off the right edge).
       Keep the id and the clip-path. -->
  <g id="shine" clip-path="url(#coin-clip)">
    <g id="shine-band" transform="translate(-60 0)">
      <rect x="110" y="-20" width="70" height="340" fill="url(#shine-grad)" transform="rotate(20 150 150)"/>
    </g>
  </g>
</svg>
