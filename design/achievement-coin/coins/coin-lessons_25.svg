<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none">
  <title>Signa achievement coin — LESSONS_25 (silver)</title>
  <defs>
    <!-- Exact silhouette of the coin: reuse it to clip anything that must stay inside the coin -->
    <clipPath id="coin-clip"><circle cx="150" cy="150" r="134.82"/></clipPath>
    <linearGradient id="shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- COIN: outer rim + face. Recolour per tier here. -->
  <g id="coin">
    <circle cx="150" cy="150" r="134.82" fill="#e1e7ee"/>
    <circle cx="150" cy="150" r="126" fill="#c5ced8"/>
  </g>

  <!-- EMBLEM: the carved icon. REPLACE the contents of this group for each achievement.
       Keep it centred on (150,150) and ~55% of the face diameter (about 140 units wide). -->
  <g id="emblem">
    <path transform="translate(77.5 78) scale(0.578125)" d="M231.65,194.55,198.46,36.75a16,16,0,0,0-19-12.39L132.65,34.42a16.08,16.08,0,0,0-12.3,19l33.19,157.8A16,16,0,0,0,169.16,224a16.25,16.25,0,0,0,3.38-.36l46.81-10.06A16.09,16.09,0,0,0,231.65,194.55ZM136,50.15c0-.06,0-.09,0-.09l46.8-10,3.33,15.87L139.33,66Zm10,47.38-3.35-15.9,46.82-10.06,3.34,15.9Zm70,100.41-46.8,10-3.33-15.87L212.67,182,216,197.85C216,197.91,216,197.94,216,197.94ZM104,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V48A16,16,0,0,0,104,32ZM56,48h48V64H56Zm48,160H56V192h48v16Z" fill="#7d8794"/>
    <path transform="translate(79.5 80.5) scale(0.578125)" d="M231.65,194.55,198.46,36.75a16,16,0,0,0-19-12.39L132.65,34.42a16.08,16.08,0,0,0-12.3,19l33.19,157.8A16,16,0,0,0,169.16,224a16.25,16.25,0,0,0,3.38-.36l46.81-10.06A16.09,16.09,0,0,0,231.65,194.55ZM136,50.15c0-.06,0-.09,0-.09l46.8-10,3.33,15.87L139.33,66Zm10,47.38-3.35-15.9,46.82-10.06,3.34,15.9Zm70,100.41-46.8,10-3.33-15.87L212.67,182,216,197.85C216,197.91,216,197.94,216,197.94ZM104,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V48A16,16,0,0,0,104,32ZM56,48h48V64H56Zm48,160H56V192h48v16Z" fill="#7d8794"/>
    <path transform="translate(76 76) scale(0.578125)" d="M231.65,194.55,198.46,36.75a16,16,0,0,0-19-12.39L132.65,34.42a16.08,16.08,0,0,0-12.3,19l33.19,157.8A16,16,0,0,0,169.16,224a16.25,16.25,0,0,0,3.38-.36l46.81-10.06A16.09,16.09,0,0,0,231.65,194.55ZM136,50.15c0-.06,0-.09,0-.09l46.8-10,3.33,15.87L139.33,66Zm10,47.38-3.35-15.9,46.82-10.06,3.34,15.9Zm70,100.41-46.8,10-3.33-15.87L212.67,182,216,197.85C216,197.91,216,197.94,216,197.94ZM104,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V48A16,16,0,0,0,104,32ZM56,48h48V64H56Zm48,160H56V192h48v16Z" fill="#e1e7ee"/>
  </g>

  <!-- GLOSS: static 20% white veil over the whole coin (as in the current medal). -->
  <g id="gloss">
    <circle cx="150" cy="150" r="134.82" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>

  <!-- SHINE: diagonal light band, clipped to the coin. The app animates ONLY this group,
       sliding it with translateX from -260 (off the left edge) to +260 (off the right edge).
       Keep the id and the clip-path. -->
  <g id="shine" clip-path="url(#coin-clip)">
    <g id="shine-band" transform="translate(-60 0)">
      <rect x="110" y="-20" width="70" height="340" fill="url(#shine-grad)" transform="rotate(20 150 150)"/>
    </g>
  </g>
</svg>
