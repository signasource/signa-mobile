<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none">
  <title>Signa achievement coin — LESSONS_50 (gold)</title>
  <defs>
    <!-- Exact silhouette of the coin: reuse it to clip anything that must stay inside the coin -->
    <clipPath id="coin-clip"><circle cx="150" cy="150" r="134.82"/></clipPath>
    <linearGradient id="shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- COIN: outer rim + face. Recolour per tier here. -->
  <g id="coin">
    <circle cx="150" cy="150" r="134.82" fill="#ffeba3"/>
    <circle cx="150" cy="150" r="126" fill="#ffda00"/>
  </g>

  <!-- EMBLEM: the carved icon. REPLACE the contents of this group for each achievement.
       Keep it centred on (150,150) and ~55% of the face diameter (about 140 units wide). -->
  <g id="emblem">
    <path transform="translate(77.5 78) scale(0.578125)" d="M226.53,56.41l-96-32a8,8,0,0,0-5.06,0l-96,32A8,8,0,0,0,24,64v80a8,8,0,0,0,16,0V75.1L73.59,86.29a64,64,0,0,0,20.65,88.05c-18,7.06-33.56,19.83-44.94,37.29a8,8,0,1,0,13.4,8.74C77.77,197.25,101.57,184,128,184s50.23,13.25,65.3,36.37a8,8,0,0,0,13.4-8.74c-11.38-17.46-27-30.23-44.94-37.29a64,64,0,0,0,20.65-88l44.12-14.7a8,8,0,0,0,0-15.18ZM176,120A48,48,0,1,1,89.35,91.55l36.12,12a8,8,0,0,0,5.06,0l36.12-12A47.89,47.89,0,0,1,176,120Z" fill="#ff9800"/>
    <path transform="translate(79.5 80.5) scale(0.578125)" d="M226.53,56.41l-96-32a8,8,0,0,0-5.06,0l-96,32A8,8,0,0,0,24,64v80a8,8,0,0,0,16,0V75.1L73.59,86.29a64,64,0,0,0,20.65,88.05c-18,7.06-33.56,19.83-44.94,37.29a8,8,0,1,0,13.4,8.74C77.77,197.25,101.57,184,128,184s50.23,13.25,65.3,36.37a8,8,0,0,0,13.4-8.74c-11.38-17.46-27-30.23-44.94-37.29a64,64,0,0,0,20.65-88l44.12-14.7a8,8,0,0,0,0-15.18ZM176,120A48,48,0,1,1,89.35,91.55l36.12,12a8,8,0,0,0,5.06,0l36.12-12A47.89,47.89,0,0,1,176,120Z" fill="#ff9800"/>
    <path transform="translate(76 76) scale(0.578125)" d="M226.53,56.41l-96-32a8,8,0,0,0-5.06,0l-96,32A8,8,0,0,0,24,64v80a8,8,0,0,0,16,0V75.1L73.59,86.29a64,64,0,0,0,20.65,88.05c-18,7.06-33.56,19.83-44.94,37.29a8,8,0,1,0,13.4,8.74C77.77,197.25,101.57,184,128,184s50.23,13.25,65.3,36.37a8,8,0,0,0,13.4-8.74c-11.38-17.46-27-30.23-44.94-37.29a64,64,0,0,0,20.65-88l44.12-14.7a8,8,0,0,0,0-15.18ZM176,120A48,48,0,1,1,89.35,91.55l36.12,12a8,8,0,0,0,5.06,0l36.12-12A47.89,47.89,0,0,1,176,120Z" fill="#ffeba3"/>
  </g>

  <!-- GLOSS: static 20% white veil over the whole coin (as in the current medal). -->
  <g id="gloss">
    <circle cx="150" cy="150" r="134.82" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>

  <!-- SHINE: diagonal light band, clipped to the coin. The app animates ONLY this group,
       sliding it with translateX from -260 (off the left edge) to +260 (off the right edge).
       Keep the id and the clip-path. -->
  <g id="shine" clip-path="url(#coin-clip)">
    <g id="shine-band" transform="translate(-60 0)">
      <rect x="110" y="-20" width="70" height="340" fill="url(#shine-grad)" transform="rotate(20 150 150)"/>
    </g>
  </g>
</svg>
