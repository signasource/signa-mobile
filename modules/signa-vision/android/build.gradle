apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.signa.vision'
version = '0.1.0'

android {
  namespace "com.signa.vision"
  compileSdk 36

  defaultConfig {
    minSdk 24
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"
  // Los MISMOS modelos que ya usamos, pero con el runtime nativo en vez del
  // WASM dentro del WebView.
  implementation 'com.google.mediapipe:tasks-vision:0.10.35'

  // Cámara nativa: el frame va de la cámara al detector sin pasar por el
  // puente de JS ni por un canvas intermedio, que es de donde salía buena
  // parte del costo en la versión web.
  def camerax = "1.4.2"
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"
}
